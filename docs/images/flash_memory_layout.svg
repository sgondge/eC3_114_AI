<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #555; }
      .label { font-size: 12px; fill: #222; font-weight: 600; }
      .addr { font-size: 11px; fill: #444; font-family: Consolas, monospace; }
      .note { font-size: 11px; fill: #666; }
      .box-text { font-size: 11px; fill: #fff; font-weight: 600; }
      .box-addr { font-size: 10px; fill: rgba(255,255,255,0.9); font-family: Consolas, monospace; }
    </style>
    <linearGradient id="iap" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4a6fa5"/><stop offset="100%" stop-color="#3d5a80"/></linearGradient>
    <linearGradient id="ap" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5c7a4a"/><stop offset="100%" stop-color="#4a6340"/></linearGradient>
    <linearGradient id="data-low" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c9a227"/><stop offset="100%" stop-color="#a8841f"/></linearGradient>
    <linearGradient id="data-high" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b85c38"/><stop offset="100%" stop-color="#9a4a2c"/></linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7b5ea7"/><stop offset="100%" stop-color="#624889"/></linearGradient>
    <linearGradient id="meta" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6b8f9c"/><stop offset="100%" stop-color="#557580"/></linearGradient>
  </defs>

  <text x="410" y="32" text-anchor="middle" class="title">HT32F54253 Internal Flash Layout (127 KB)</text>
  <text x="410" y="52" text-anchor="middle" class="subtitle">Memory-mapped from 0x00000000  emulated EEPROM regions in colour</text>

  <!-- Scale bar: 127KB total, diagram height ~480px, 1px H 272 bytes -->
  <rect x="120" y="70" width="480" height="480" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
  <line x1="100" y1="70" x2="100" y2="550" stroke="#999" stroke-width="1"/>
  <text x="95" y="78" text-anchor="end" class="addr">0x00000000</text>
  <text x="95" y="548" text-anchor="end" class="addr">~0x0001FBFF</text>

  <!-- IAP 12KB: 0-0x2FFF = 12288/130048 H 9.4% of 480 = 45px -->
  <rect x="120" y="70" width="480" height="45" fill="url(#iap)" rx="2"/>
  <text x="360" y="90" text-anchor="middle" class="box-text">IAP Bootloader (12 KB)</text>
  <text x="360" y="106" text-anchor="middle" class="box-addr">0x00000000  0x00002FFF</text>

  <!-- Identity block overlay in IAP region -->
  <rect x="400" y="78" width="190" height="30" fill="url(#data-low)" stroke="#fff" stroke-width="1" rx="2" opacity="0.95"/>
  <text x="495" y="92" text-anchor="middle" class="box-text" font-size="10">Serial ID · Secret Key · Runtime Params</text>
  <text x="495" y="104" text-anchor="middle" class="box-addr">0x2C00 · 0x2C04 · 0x2C20</text>

  <!-- AP Application: 0x3000 to ~0x18BFF - large block -->
  <rect x="120" y="115" width="480" height="280" fill="url(#ap)" rx="2"/>
  <text x="360" y="240" text-anchor="middle" class="box-text" font-size="14">AP Application Firmware</text>
  <text x="360" y="260" text-anchor="middle" class="box-addr">0x00003000  ~0x00018BFF (~92 KB code)</text>

  <!-- Legacy cook buffer inside AP region -->
  <rect x="130" y="200" width="160" height="22" fill="url(#data-low)" stroke="#fff" stroke-width="1" rx="2" opacity="0.85"/>
  <text x="210" y="215" text-anchor="middle" class="box-text" font-size="9">Legacy cook buffer (16 B)</text>
  <text x="210" y="226" text-anchor="middle" class="box-addr" font-size="9">0x0000FF90</text>

  <!-- Session count -->
  <rect x="120" y="395" width="480" height="28" fill="url(#counter)" rx="2"/>
  <text x="360" y="413" text-anchor="middle" class="box-text">Cook Session Count (4 bytes)</text>
  <text x="360" y="425" text-anchor="middle" class="box-addr">0x00018C00</text>

  <!-- Session store -->
  <rect x="120" y="423" width="480" height="108" fill="url(#data-high)" rx="2"/>
  <text x="360" y="455" text-anchor="middle" class="box-text" font-size="13">Cook Session Array (~28 KB)</text>
  <text x="360" y="472" text-anchor="middle" class="box-addr">0x00019000  0x0001FF00</text>
  <text x="360" y="492" text-anchor="middle" class="box-text" font-size="11">20 bytes × ~1420 sessions (dense indexed array)</text>
  <text x="360" y="510" text-anchor="middle" class="box-addr">addr = 0x19000 + index × 20</text>

  <!-- Meta -->
  <rect x="120" y="531" width="480" height="19" fill="url(#meta)" rx="2"/>
  <text x="360" y="544" text-anchor="middle" class="box-text" font-size="10">Plate Number / Meta (1 byte)  0x0001FF04</text>

  <!-- Legend -->
  <rect x="620" y="90" width="180" height="200" fill="#fafafa" stroke="#ddd" rx="6"/>
  <text x="710" y="112" text-anchor="middle" class="label">Legend</text>
  <rect x="635" y="125" width="14" height="14" fill="url(#iap)"/><text x="655" y="136" class="note">Bootloader (IAP)</text>
  <rect x="635" y="148" width="14" height="14" fill="url(#ap)"/><text x="655" y="159" class="note">Application code</text>
  <rect x="635" y="171" width="14" height="14" fill="url(#data-low)"/><text x="655" y="182" class="note">Identity / legacy data</text>
  <rect x="635" y="194" width="14" height="14" fill="url(#counter)"/><text x="655" y="205" class="note">Session counter</text>
  <rect x="635" y="217" width="14" height="14" fill="url(#data-high)"/><text x="655" y="228" class="note">Cooking sessions</text>
  <rect x="635" y="240" width="14" height="14" fill="url(#meta)"/><text x="655" y="251" class="note">Meta / plate config</text>

  <!-- SRAM note -->
  <rect x="620" y="310" width="180" height="70" fill="#eef4ff" stroke="#aac" rx="6"/>
  <text x="710" y="332" text-anchor="middle" class="label">SRAM (separate)</text>
  <text x="710" y="350" text-anchor="middle" class="addr">0x20000000</text>
  <text x="710" y="368" text-anchor="middle" class="note">BOOT_MODE flag (4 B)</text>

  <text x="410" y="600" text-anchor="middle" class="note">Source: EEPROM.h, ht32_board_config.h  HT32F54253 (127 × 1 KB pages)</text>
</svg>
