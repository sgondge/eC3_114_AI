<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #555; }
      .phase { font-size: 11px; fill: #fff; font-weight: 700; }
      .detail { font-size: 10px; fill: rgba(255,255,255,0.92); }
      .module { font-size: 9px; fill: rgba(255,255,255,0.75); font-family: Consolas, monospace; }
      .lane-label { font-size: 10px; fill: #666; font-weight: 600; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <text x="460" y="30" text-anchor="middle" class="title">Cooking Data  End-to-End Lifecycle</text>
  <text x="460" y="50" text-anchor="middle" class="subtitle">From session close through MQTT upload to flash deletion</text>

  <!-- Swimlane backgrounds -->
  <rect x="30" y="65" width="860" height="55" fill="#f0f7f0" rx="4"/>
  <rect x="30" y="125" width="860" height="55" fill="#f0f4fa" rx="4"/>
  <rect x="30" y="185" width="860" height="55" fill="#faf5f0" rx="4"/>
  <rect x="30" y="245" width="860" height="55" fill="#f5f0fa" rx="4"/>

  <text x="18" y="98" text-anchor="end" class="lane-label">FSM</text>
  <text x="18" y="158" text-anchor="end" class="lane-label">Flash</text>
  <text x="18" y="218" text-anchor="end" class="lane-label">MQTT</text>
  <text x="18" y="278" text-anchor="end" class="lane-label">Cleanup</text>

  <!-- Step 1 -->
  <rect x="50" y="78" width="115" height="40" rx="6" fill="#4a7c59"/>
  <text x="107" y="96" text-anchor="middle" class="phase">Cook ends</text>
  <text x="107" y="110" text-anchor="middle" class="module">closeSession()</text>

  <line x1="165" y1="98" x2="195" y2="98" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="195" y="78" width="115" height="40" rx="6" fill="#4a7c59"/>
  <text x="252" y="96" text-anchor="middle" class="phase">Validate</text>
  <text x="252" y="110" text-anchor="middle" class="detail">&gt;5s · offT&gt;onT</text>

  <line x1="310" y1="98" x2="340" y2="98" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="98" x2="340" y2="152" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 Flash write -->
  <rect x="280" y="138" width="130" height="40" rx="6" fill="#b85c38"/>
  <text x="345" y="156" text-anchor="middle" class="phase">Append record</text>
  <text x="345" y="170" text-anchor="middle" class="module">Write_Cook_Session</text>

  <line x1="410" y1="158" x2="440" y2="158" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4 counter -->
  <rect x="440" y="138" width="120" height="40" rx="6" fill="#7b5ea7"/>
  <text x="500" y="156" text-anchor="middle" class="phase">Update count</text>
  <text x="500" y="170" text-anchor="middle" class="module">0x00018C00</text>

  <line x1="500" y1="178" x2="500" y2="208" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="208" x2="560" y2="208" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5 EVENT_OFF / trigger -->
  <rect x="50" y="198" width="120" height="40" rx="6" fill="#4a6fa5"/>
  <text x="110" y="216" text-anchor="middle" class="phase">Stove OFF</text>
  <text x="110" y="230" text-anchor="middle" class="module">EVENT_OFF</text>

  <line x1="170" y1="218" x2="200" y2="218" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 6 connect -->
  <rect x="200" y="198" width="130" height="40" rx="6" fill="#4a6fa5"/>
  <text x="265" y="216" text-anchor="middle" class="phase">MQTT connect</text>
  <text x="265" y="230" text-anchor="middle" class="detail">on_demand / once</text>

  <line x1="330" y1="218" x2="360" y2="218" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 7 publish chunk -->
  <rect x="360" y="198" width="145" height="40" rx="6" fill="#4a6fa5"/>
  <text x="432" y="216" text-anchor="middle" class="phase">Publish chunk</text>
  <text x="432" y="230" text-anchor="middle" class="module">sendCookingSessionsChunk</text>

  <line x1="505" y1="218" x2="535" y2="218" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 8 ACK -->
  <rect x="535" y="198" width="115" height="40" rx="6" fill="#4a6fa5"/>
  <text x="592" y="216" text-anchor="middle" class="phase">PUBACK</text>
  <text x="592" y="230" text-anchor="middle" class="module">handleCookPublishAcked</text>

  <line x1="592" y1="238" x2="592" y2="268" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 9a ALL mode delete -->
  <rect x="520" y="258" width="155" height="40" rx="6" fill="#9a4a2c"/>
  <text x="597" y="276" text-anchor="middle" class="phase">mode = all</text>
  <text x="597" y="290" text-anchor="middle" class="module">Delete_Cook_Sessions_Range</text>

  <!-- Step 9b ESSENTIAL erase -->
  <rect x="700" y="258" width="155" height="40" rx="6" fill="#9a4a2c"/>
  <text x="777" y="276" text-anchor="middle" class="phase">mode = essential</text>
  <text x="777" y="290" text-anchor="middle" class="module">Erase_All_Cook_Sessions</text>

  <line x1="650" y1="278" x2="700" y2="278" stroke="#888" stroke-dasharray="4,3"/>
  <text x="675" y="272" text-anchor="middle" font-size="9" fill="#888">or</text>

  <line x1="675" y1="278" x2="675" y2="218" stroke="#888" stroke-dasharray="4,3"/>

  <!-- Persistence note -->
  <rect x="680" y="78" width="200" height="95" fill="#fff" stroke="#ddd" rx="6"/>
  <text x="780" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#333">Persists across</text>
  <text x="780" y="114" text-anchor="middle" font-size="10" fill="#555">power cycles until</text>
  <text x="780" y="130" text-anchor="middle" font-size="10" fill="#555">successfully uploaded</text>
  <text x="780" y="150" text-anchor="middle" font-size="10" fill="#b85c38" font-weight="600">Flash: 0x19000+</text>
  <text x="780" y="166" text-anchor="middle" font-size="9" font-family="Consolas,monospace" fill="#666">20 B × count sessions</text>

  <!-- CLI branch -->
  <rect x="700" y="138" width="120" height="40" rx="6" fill="#6b8f9c" stroke="#557580" stroke-dasharray="4,2"/>
  <text x="760" y="156" text-anchor="middle" class="phase" fill="#fff">CLI erase</text>
  <text x="760" y="170" text-anchor="middle" class="module">command 'e'</text>
  <line x1="560" y1="158" x2="700" y2="158" stroke="#888" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="630" y="152" font-size="9" fill="#888">manual</text>

  <text x="460" y="325" text-anchor="middle" font-size="11" fill="#666">Partial delete compacts remaining sessions to index 0..N1 (full page erase + rewrite)</text>
</svg>
